name: Cypress Smoke Tests - PROD

on:
  # Automated triggers disabled - run manually via workflow_dispatch or local npm scripts
  # push:
  #   branches:
  #     - MAIN
  # pull_request:
  #   branches:
  #     - MAIN
  # schedule:
  #   # Run daily at 6am UTC (2am EST) to catch production issues
  #   - cron: '0 6 * * *'
  workflow_dispatch:  # Manual trigger from GitHub Actions UI

jobs:
  cypress-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress READONLY smoke tests on PROD
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome
          spec: 'cypress/e2e/01-readonly/**'
          config: baseUrl=https://tangotiempo.com,video=true
        env:
          CYPRESS_BASE_URL: https://tangotiempo.com

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-prod-smoke
          path: cypress/screenshots
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload videos on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-videos-prod-smoke
          path: cypress/videos
          retention-days: 30
          if-no-files-found: ignore

      - name: Create issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ PROD Smoke Tests Failed - ' + new Date().toISOString().split('T')[0],
              body: 'Production smoke tests failed during scheduled run.\n\nCheck artifacts for screenshots and videos:\n' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              labels: ['bug', 'production', 'automated-test']
            })
