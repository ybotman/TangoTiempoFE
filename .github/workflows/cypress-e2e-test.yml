name: Cypress E2E Tests - TEST

on:
  push:
    branches:
      - TEST
  pull_request:
    branches:
      - TEST
  # deployment_status removed - was triggering on DEVL commits
  # Workflow now only runs on explicit TEST branch pushes/PRs

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress against TEST environment
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome
          config: baseUrl=https://test.tangotiempo.com
        env:
          CYPRESS_BASE_URL: https://test.tangotiempo.com
          CYPRESS_TEST_USER_EMAIL: ${{ secrets.CICD_TEST_EMAIL }}
          CYPRESS_TEST_USER_PASSWORD: ${{ secrets.CICD_TEST_PASSWORD }}

      - name: Merge Mochawesome reports
        if: always()
        run: npm run report:merge

      - name: Generate HTML report
        if: always()
        run: npm run report:generate

      - name: Upload Mochawesome HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mochawesome-report-test-${{ github.run_number }}
          path: cypress/reports/html
          retention-days: 7

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-test-${{ github.run_number }}
          path: cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos-test-${{ github.run_number }}
          path: cypress/videos
          retention-days: 7
          if-no-files-found: ignore
