name: Cypress E2E Tests - TEST

on:
  push:
    branches:
      - TEST
  pull_request:
    branches:
      - TEST
  deployment_status:  # Trigger after Vercel deployment

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run on successful Vercel deployments or direct pushes
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress against TEST environment
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome
          config: baseUrl=https://test.tangotiempo.com
        env:
          CYPRESS_BASE_URL: https://test.tangotiempo.com

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-test
          path: cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos-test
          path: cypress/videos
          retention-days: 7
          if-no-files-found: ignore
